<!DOCTYPE html>
<!-- Based on https://sayonari.coresv.com/ninshikiChan/text.html -->
<html>

<head>
    <meta charset="UTF-8">
    <link href="https://fonts.googleapis.com/css?family=M+PLUS+Rounded+1c&display=swap" rel="stylesheet">

    <title>Live Translation - OBS Clean Bilingual</title>

    <style type="text/css">
        /* cousine-regular - latin */

            font-family: 'Cousine';
            font-style: normal;
            font-weight: 400;
            src: url('./fonts/cousine-v17-latin-regular.eot');
            /* IE9 Compat Modes */
            src: local(''),
                url('./fonts/cousine-v17-latin-regular.eot?#iefix') format('embedded-opentype'),
                /* IE6-IE8 */
                url('./fonts/cousine-v17-latin-regular.woff2') format('woff2'),
                /* Super Modern Browsers */
                url('./fonts/cousine-v17-latin-regular.woff') format('woff'),
                /* Modern Browsers */
                url('./fonts/cousine-v17-latin-regular.ttf') format('truetype'),
                /* Safari, Android, iOS */
                url('./fonts/cousine-v17-latin-regular.svg#Cousine') format('svg');
            /* Legacy iOS */
        }

        button,
        input,
        select,
        textarea {
            /* font-family : inherit; */
            /* font-size   : 300%; */
            /* color  : black; */
            font-weight: 0;
            text-align: center;
            /* left, center, right */
            vertical-align: top;
            /* top, middle, bottom */
            -webkit-text-stroke-color: rgb(21, 0, 141);
            -webkit-text-stroke-width: 0px;
        }

        html {
            height: 100%;
            width: 100%;
        }

        body {
            height: 100%;
            width: 100%;
            margin: 0;
            font-family: 'Cousine', sans-serif;
        }

        table {
            width: 100%;
            /* table-layout: fixed; */
        }

        table.btm_table {
            position: absolute;
            /* bottom:0; */
        }

        table td {
            /*word-break: break-all;*/
            overflow-wrap: break-word;
        }
    </style>

    <style>
        /* prepare the selectors to add a stroke to */

        .stroke-single-imb {
            /* position: absolute; */
            left: 0;
            right: 0;
            margin: 0;
            /* -webkit-text-stroke: 0px #0000FF;  */
        }

        .stroke-single-bg {
            position: absolute;
            left: 0;
            right: 0;
            margin: auto;
            /* -webkit-text-stroke: 3px #FF0000;  */
        }

        /* add a single stroke */
        .stroke-single-fg {
            position: absolute;
            left: 0;
            right: 0;
            margin: auto;
            /* -webkit-text-stroke: 0px #FFFFFF; */
        }

        body {
            background: #000000;
            color: #ffffff;
            overflow: hidden;
        }

        .translation-wrap {
            width: 100%;
            text-align: center;
            padding: 0 16px;
            box-sizing: border-box;
        }

        .translation-line {
            position: relative;
            display: block;
            width: 100%;
            min-height: 1.15em;
            line-height: 1.15;
            font-weight: 700;
            letter-spacing: 0.01em;
        }

        .translation-line + .translation-line {
            margin-top: 0.08em;
        }

        /* OBS clean mode: final translation only. */
        #speech_text-bg,
        #speech_text-fg,
        #speech_text-imb {
            display: none !important;
        }

        #translation_line1,
        #translation_line2 {
            display: none;
        }

        .stroke-single-bg,
        .stroke-single-imb {
            display: none !important;
        }

        .stroke-single-fg {
            position: relative;
            left: auto;
            right: auto;
            margin: 0;
            color: #ffffff;
            text-shadow:
                2px 2px 0 #12304a,
                -2px 2px 0 #12304a,
                2px -2px 0 #12304a,
                -2px -2px 0 #12304a,
                0 3px 6px rgba(0, 0, 0, 0.65);
        }
    </style>

    <script>
        var flag_speech = 0;

        // Speech recognition starts when window is loaded --------------
        window.onload = function () {
            vr_function();
        };

        // Function for getting URL parameters ---------------------------
        function getParam(name, url) {
            if (!url) url = window.location.href;
            name = name.replace(/[\[\]]/g, "\\$&");
            var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
                results = regex.exec(url);
            if (!results) return null;
            if (!results[2]) return '';
            return decodeURIComponent(results[2].replace(/\+/g, " "));
        }

        function setText(idBase, text) {
            var ids = ['-imb', '-bg', '-fg'];
            ids.forEach(function (suffix) {
                var el = document.getElementById(idBase + suffix);
                if (el) el.innerHTML = text;
            });
        }

        function setTranslationLine(lineNumber, text) {
            var value = text || '';
            document.getElementById('trans_text' + lineNumber + '-imb').innerHTML = value;
            document.getElementById('trans_text' + lineNumber + '-bg').innerHTML = value;
            document.getElementById('trans_text' + lineNumber + '-fg').innerHTML = value;

            var line = document.getElementById('translation_line' + lineNumber);
            line.style.display = value ? 'block' : 'none';
        }

        function clearTranslations() {
            setTranslationLine(1, '');
            setTranslationLine(2, '');
        }

        function normalizeTranslationLanguage(lang) {
            if (!lang) return '';
            return lang.split('-')[0].toLowerCase();
        }

        function vr_function() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!window.SpeechRecognition && !window.webkitSpeechRecognition) {
                clearTranslations();
                return;
            }

            // Settings for voice recognition ----------------------
            var RecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;
            var recognition = new RecognitionCtor();
            recognition.lang = 'en';
            recognition.interimResults = true;
            recognition.continuous = true;

            // Translation settings ---------------------------
            // Speech recognition language is fixed by the 'recog' URL parameter.
            // Translation source language is AUTO-DETECTED by Google Apps Script
            // using LanguageApp.translate(text, '', targetLanguage).
            var trans_sourcelang = '';
            var trans_destlang1 = 'en';
            var trans_destlang2 = 'ms';

            var gs_key = getParam('gs_key');
            var TRANS_URL = 'https://script.google.com/macros/s/' + gs_key + '/exec';

            //////////////////////////////////////////////////////////
            // URL parameters -------------------
            var arg_recog = getParam('recog');
            var arg_trans = getParam('trans');
            var arg_trans1 = getParam('trans1');
            var arg_trans2 = getParam('trans2');

            // Speech recognition language ----------------------------
            if (arg_recog != null && arg_recog !== '') {
                recognition.lang = arg_recog;
            }

            // Bilingual output targets. Source language is intentionally AUTO.
            if (arg_trans1 != null && arg_trans1 !== '') {
                trans_destlang1 = normalizeTranslationLanguage(arg_trans1);
            } else {
                trans_destlang1 = 'en';
            }

            if (arg_trans2 != null && arg_trans2 !== '') {
                trans_destlang2 = normalizeTranslationLanguage(arg_trans2);
            } else {
                trans_destlang2 = 'ms';
            }

            // Legacy single-target compatibility:
            // ?trans=ms -> English + Malay
            // ?trans=en -> English + Malay
            if (arg_trans1 == null && arg_trans === 'ms') {
                trans_destlang1 = 'en';
                trans_destlang2 = 'ms';
            } else if (arg_trans1 == null && arg_trans === 'en') {
                trans_destlang1 = 'en';
                trans_destlang2 = 'ms';
            }

            /////////////////////////////////////////////////////////
            // Events ---------------------------------
            recognition.onsoundstart = function () {};
            recognition.onspeechstart = function () {};
            recognition.onnomatch = function () {};

            recognition.onerror = function (event) {
                console.warn('Speech recognition error:', event && event.error ? event.error : event);
                try { recognition.stop(); } catch (e) {}
                setTimeout(function () {
                    try { recognition.start(); } catch (e) {}
                }, 250);
            };

            recognition.onsoundend = function () {
                try { recognition.stop(); } catch (e) {}
                setTimeout(function () {
                    try { recognition.start(); } catch (e) {}
                }, 100);
            };

            recognition.onspeechend = function () {
                try { recognition.stop(); } catch (e) {}
                setTimeout(function () {
                    try { recognition.start(); } catch (e) {}
                }, 100);
            };

            function translateOne(text, targetLang, callback) {
                // Source language is deliberately blank. Google Apps Script
                // auto-detects the source language for each utterance.
                if (!gs_key) {
                    callback('[Missing gs_key]');
                    return;
                }

                var prefixName =
                    'handleTranslation_' + Date.now() + '_' +
                    Math.random().toString(36).substring(2, 8);

                var query = TRANS_URL
                    + '?text=' + encodeURIComponent(text)
                    + '&source=' + encodeURIComponent('')
                    + '&target=' + encodeURIComponent(targetLang)
                    + '&prefix=' + encodeURIComponent(prefixName);

                var script = document.createElement('script');
                var finished = false;

                function cleanup() {
                    if (script.parentNode) {
                        script.parentNode.removeChild(script);
                    }
                    try {
                        delete window[prefixName];
                    } catch (e) {
                        window[prefixName] = undefined;
                    }
                }

                window[prefixName] = function (data) {
                    if (finished) return;
                    finished = true;

                    var result = '';
                    if (data && typeof data.translatedText !== 'undefined') {
                        result = data.translatedText;
                    } else {
                        console.error('Unexpected translation response:', data);
                        result = '[Translation error]';
                    }

                    cleanup();
                    callback(result);
                };

                script.src = query;
                script.async = true;

                script.onerror = function (error) {
                    if (finished) return;
                    finished = true;
                    console.error('Translation request failed:', error);
                    cleanup();
                    callback('[Translation error]');
                };

                document.head.appendChild(script);
            }

            //////////////////////////////////////////////////////////
            // When the recognition result is returned ------------------
            recognition.onresult = function (event) {
                var results = event.results;

                for (var i = event.resultIndex; i < results.length; i++) {
                    if (results[i].isFinal) {
                        var recog_text = results[i][0].transcript.trim();

                        if (!recog_text) continue;

                        // OBS clean mode: never display the raw/interim speech text.
                        // One recognition -> two outputs. Source language is auto-detected upstream.
                        var resultsNeeded = 2;
                        var result1 = '';
                        var result2 = '';

                        function done() {
                            resultsNeeded -= 1;
                            if (resultsNeeded === 0) {
                                setTranslationLine(1, result1);
                                setTranslationLine(2, result2);
                            }
                        }

                        translateOne(recog_text, trans_destlang1, function (text) {
                            result1 = text;
                            done();
                        });

                        translateOne(recog_text, trans_destlang2, function (text) {
                            result2 = text;
                            done();
                        });
                    } else {
                        // Interim speech is intentionally hidden for OBS.
                        flag_speech = 1;
                    }
                }
            };

            flag_speech = 0;

            try {
                recognition.start();
            } catch (e) {
                setTimeout(function () {
                    try { recognition.start(); } catch (e2) {}
                }, 250);
            }
        }
    </script>
</head>






<body>
    <div class="big" id="result_text">
        <table id="text_table" class="btm_table">
            <tr>
                <td id="tbl_td" align="center" valign="bottom">
                    <div class="translation-wrap" id="translation_wrap">
                        <div class="translation-line" id="translation_line1">
                            <div class="stroke-single-bg" id="trans_text1-bg"></div>
                            <div class="stroke-single-fg" id="trans_text1-fg"></div>
                            <div class="stroke-single-imb" id="trans_text1-imb"></div>
                        </div>

                        <div class="translation-line" id="translation_line2">
                            <div class="stroke-single-bg" id="trans_text2-bg"></div>
                            <div class="stroke-single-fg" id="trans_text2-fg"></div>
                            <div class="stroke-single-imb" id="trans_text2-imb"></div>
                        </div>
                    </div>
                </td>
            </tr>
        </table>
    </div>
</body>

<!-- ############## Last script ############## -->
<script type="text/javascript">

    // Change display style ---------------------------------
    if (getParam('bgcolor') != null) {
        document.bgColor = getParam('bgcolor');
    }

    if (getParam('v_align') == "top") {
        document.getElementById("text_table").style.bottom = -1;
    } else if (getParam('v_align') == "bottom") {
        document.getElementById("text_table").style.bottom = 0;
    }

    // Speech/interim text is hidden in OBS clean mode.

    if (getParam('bgcolor') != null) {
        document.getElementById("trans_text1-imb").style.webkitTextStrokeColor = getParam('bgcolor');
        document.getElementById("trans_text2-imb").style.webkitTextStrokeColor = getParam('bgcolor');
    }

    if (getParam('st_width') != null) {
        document.getElementById("trans_text1-imb").style.webkitTextStrokeWidth = getParam('st_width') + 'pt';
        document.getElementById("trans_text2-imb").style.webkitTextStrokeWidth = getParam('st_width') + 'pt';
    }


    // Global subtitle styling
    if (getParam('font') != null) {
        document.getElementById("result_text").style.fontFamily = "'" + getParam('font') + "'";
    }

    if (getParam('size') != null) {
        document.getElementById("result_text").style.fontSize = getParam('size') + 'pt';
    }

    if (getParam('weight') != null) {
        document.getElementById("result_text").style.fontWeight = getParam('weight');
    }

    // Clean OBS defaults: bright text with a dark blue shadow.
    document.getElementById("trans_text1-fg").style.color = '#ffffff';
    document.getElementById("trans_text2-fg").style.color = '#ffffff';

    // Translation result text
    if (getParam('color') != null) {
        document.getElementById("trans_text1-fg").style.color = getParam('color');
        document.getElementById("trans_text2-fg").style.color = getParam('color');
    }

    if (getParam('st_color') != null) {
        document.getElementById("trans_text1-bg").style.webkitTextStrokeColor = getParam('st_color');
        document.getElementById("trans_text2-bg").style.webkitTextStrokeColor = getParam('st_color');
    }

    if (getParam('st_width') != null) {
        document.getElementById("trans_text1-bg").style.webkitTextStrokeWidth = getParam('st_width') + 'pt';
        document.getElementById("trans_text2-bg").style.webkitTextStrokeWidth = getParam('st_width') + 'pt';
    }

    function getParam(name, url) {
        if (!url) url = window.location.href;
        name = name.replace(/[\[\]]/g, "\\$&");
        var regex = new RegExp("[?&]" + name + "(=([^&#]*)|&|#|$)"),
            results = regex.exec(url);
        if (!results) return null;
        if (!results[2]) return '';
        return decodeURIComponent(results[2].replace(/\+/g, " "));
    }
</script>

</html>
